<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#132c32">
  <meta name="description" content="Log in or create your Hallo Deutsch account.">
  <title>Log in · Hallo Deutsch</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="login.css">
</head>
<body class="auth-page">
  <picture class="auth-backdrop" aria-hidden="true">
    <img src="assets/login-mountain.jpg" alt="">
  </picture>
  <div class="auth-shade" aria-hidden="true"></div>
  <main class="login-stage">
    <section class="auth-card" aria-label="Hallo Deutsch account">
      <a class="auth-brand" href="./" aria-label="Hallo Deutsch home"><span class="auth-brand-mark">H</span><span>hallo <strong>deutsch</strong></span></a>
      <div class="auth-tabs" role="tablist" aria-label="Account access">
        <button class="auth-tab" id="login-tab" type="button" role="tab" aria-selected="true" aria-controls="login-panel">Log in</button>
        <button class="auth-tab" id="register-tab" type="button" role="tab" aria-selected="false" aria-controls="register-panel">Sign up</button>
      </div>

      <section id="login-panel" class="auth-panel" role="tabpanel" aria-labelledby="login-tab">
        <h1>Log in</h1>
        <form id="login-form">
          <label for="login-email">Email</label>
          <input id="login-email" name="email" type="email" autocomplete="email" placeholder="Email address" required>
          <div class="password-label"><label for="login-password">Password</label><button class="text-button" id="forgot-password" type="button">Forgot password?</button></div>
          <input id="login-password" name="password" type="password" autocomplete="current-password" placeholder="Password" required>
          <button class="primary-auth-button" type="submit">Log in <span aria-hidden="true">→</span></button>
        </form>
        <div class="auth-divider"><span>or</span></div>
        <div class="provider-buttons">
          <button class="provider-button" type="button" data-provider="google"><span class="google-mark" aria-hidden="true">G</span><span>Continue with Google</span></button>
          
        </div>
      </section>

      <section id="register-panel" class="auth-panel" role="tabpanel" aria-labelledby="register-tab" hidden>
        <h1>Create account</h1>
        <form id="register-form">
          <label for="register-name">Name</label>
          <input id="register-name" name="name" type="text" autocomplete="name" placeholder="Your name" required>
          <label for="register-email">Email</label>
          <input id="register-email" name="email" type="email" autocomplete="email" placeholder="Email address" required>
          <label for="register-password">Password</label>
          <input id="register-password" name="password" type="password" autocomplete="new-password" minlength="8" placeholder="At least 8 characters" required>
          <label for="register-confirm">Repeat password</label>
          <input id="register-confirm" name="confirmPassword" type="password" autocomplete="new-password" minlength="8" placeholder="Repeat password" required>
          <button class="primary-auth-button" type="submit">Create account <span aria-hidden="true">→</span></button>
        </form>
        <div class="auth-divider"><span>or</span></div>
        <div class="provider-buttons">
          <button class="provider-button" type="button" data-provider="google"><span class="google-mark" aria-hidden="true">G</span><span>Continue with Google</span></button>
          
        </div>
      </section>
      <p class="auth-status" id="auth-status" role="status" aria-live="polite" hidden></p>
      <p class="auth-switch" id="auth-switch">New to Hallo Deutsch? <button class="text-button" type="button" data-show="register">Create account</button></p>
    </section>
  </main>
  <script src="auth-config.js?v=auth-setup-2"></script>
  <script type="module" src="login.js?v=auth-setup-2"></script>
</body>
</html>
